[project]
name = "dsl-ltspice-mcp"
version = "0.1.0"
description = "LTspice MCP server by Double Secret Labs: batch simulation, waveforms, .meas results, schematic-to-SVG and LTspice docs."
requires-python = ">=3.11"
authors = [{ name = "Double Secret Labs" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mcp>=1.20,<2",
    "numpy>=2.0",
]

[project.scripts]
dsl-ltspice-mcp = "dsl_ltspice_mcp:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# cryptography is only needed by pyjwt for OAuth flows, which a local stdio
# server never uses, and it has no prebuilt wheel for some Windows ARM64 Pythons.
override-dependencies = ["cryptography; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
